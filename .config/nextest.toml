# Nextest configuration.
#
# Why this file exists (2026-05-14, bd-u3ze): on macOS, running multiple
# `cargo nextest` processes that each construct a `notify-rs` FSEvents
# watcher under default I/O capture causes filesystem events to silently
# fail to reach our `on_file_changed` callback. The symptom is the
# staleness test timing out at 15 s waiting for a write event that
# never propagates, while standalone runs and `--no-capture` runs both
# pass in ~1.1 s. The root cause appears to live in the interaction
# between notify-rs's CFRunLoop-based FSEvents backend and nextest's
# per-process stdout/stderr pipe setup; we couldn't fix it from the
# Rust side.
#
# Workaround: serialize the quarto-preview integration tests that boot
# the full server (and therefore arm a real FSEvents watcher). Each
# still runs in its own process; nextest just ensures only one of them
# is in flight at a time. Adds ~3-4 seconds to the workspace test suite
# at most, in exchange for deterministic results.
#
# If you're adding a new integration test under `crates/quarto-preview/
# tests/integration/` that calls `run_with_on_ready` or otherwise
# instantiates the file watcher, add its module name to the regex
# in the override filter below.
#
# Layout note (2026-05-28, bd-xvdop): integration tests across the
# workspace now live in `tests/integration/main.rs` + sibling modules
# (matklad pattern), so each crate produces a single `integration`
# test binary instead of one binary per file. Filters that used to
# target per-file binary names now need `package(...) & test(...::)`
# selectors instead.

[test-groups]
# Quarto-preview integration tests that arm a `notify-rs` FSEvents
# watcher. Limited to one in-flight process at a time.
quarto-preview-fs-watcher = { max-threads = 1 }

# Julia-engine e2e tests share ONE ambient transport file
# (`~/Library/Caches/quarto/julia/julia_transport.txt`): each test uses
# `setup_julia_project()` (temp project dir, but NOT a temp HOME), so
# concurrent `daemon: false` runs each boot their own QNR server and
# overwrite each other's transport entry — a client then reads a stale
# entry and fails the socket handshake with "Incorrect HMAC digest" at
# `isopen`. Observed 2026-07-03 (bd-h4rhohhy P3 verification): rotating
# victims (j1/j2 on one run, j3/j4 on a clean-machine rerun) confirm an
# intra-suite race, not any single bad test. Serializing the suite is
# the config-level fix; full hermetic isolation for the j-tests is
# tracked separately (they belong to the julia-validation plan).
julia-shared-transport = { max-threads = 1 }

[[profile.default.overrides]]
filter = "package(quarto-preview) & binary(integration) & test(/^(staleness|eager_capture|boot)::/)"
test-group = "quarto-preview-fs-watcher"

[[profile.default.overrides]]
filter = "package(quarto-core) & binary(integration) & test(/^julia_engine_e2e::/)"
test-group = "julia-shared-transport"
