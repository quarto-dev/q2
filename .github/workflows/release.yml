# Release (bd-c6l13j79): tag push (or manual dispatch on an existing tag)
# → preflight (tag must equal the workspace Cargo.toml version) → the
# shared release pipeline (release-pipeline.yml: web payloads → 5-target
# build → checksummed, signed artifacts → GitHub Release).
#
# The build/verify/sign/publish jobs live in release-pipeline.yml
# (bd-p4ljdp2e) so the Nightly workflow runs the same gates; this file
# is only the release channel's trigger and preflight. Artifact naming,
# the install.sh contract, the musl/keyring/signing history — all of it
# is documented at the top of release-pipeline.yml.
#
# Runbook: claude-notes/instructions/release-runbook.md
# Plan: claude-notes/plans/2026-06-12-q2-github-releases-bundled-mcp.md

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)release, e.g. v0.1.0'
        required: true
        type: string
      publish:
        description: >-
          Create the GitHub Release. Untick for a dry run that builds,
          verifies and signs, then uploads the signed set as a
          `release-set` artifact without touching the release.
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'quarto-dev/q2'
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          # On workflow_dispatch the default ref is the branch; build
          # from the requested tag so artifacts match what we verify.
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "v$CARGO_VERSION" != "$TAG" ]; then
            echo "::error::tag $TAG does not match workspace Cargo.toml version $CARGO_VERSION"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (version $CARGO_VERSION)"

  # `publish` is a string-typed input on push events (unset), so the
  # expression spells out the default: publish unless a dispatch said no.
  pipeline:
    name: Release pipeline
    needs: preflight
    uses: ./.github/workflows/release-pipeline.yml
    with:
      ref: ${{ needs.preflight.outputs.tag }}
      version: ${{ needs.preflight.outputs.version }}
      tag: ${{ needs.preflight.outputs.tag }}
      channel: release
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    secrets: inherit
