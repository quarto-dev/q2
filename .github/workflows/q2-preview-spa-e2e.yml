name: q2-preview-spa E2E (browser trial)

# Trial workflow: runs the q2 preview Playwright suite on Chromium and
# Firefox to find out whether Firefox is viable. These specs are not run
# by any other workflow (locally they go through `cargo xtask verify --e2e`).
# Triggers on manual dispatch and on pull requests that touch this file, the
# SPA and its Playwright config, or the crates and packages the preview binary
# embeds (the paths below). Installs native pandoc and typst for the typst-pdf
# preview spec.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/q2-preview-spa-e2e.yml'
      - 'q2-preview-spa/playwright.config.ts'
      - 'q2-preview-spa/src/**'
      - 'q2-preview-spa/e2e/**'
      - 'crates/quarto/**'
      - 'crates/quarto-preview/**'
      - 'crates/quarto-core/**'
      - 'crates/quarto-hub/**'
      - 'crates/spa-manifest/**'
      - 'scripts/fetch-pandoc-wasm.mjs'
      - 'resources/pdfjs-viewer.json'
      - 'ts-packages/pdf-viewer/**'
      - 'ts-packages/preview-runtime/**'
      - 'ts-packages/preview-renderer/**'
      - 'Cargo.lock'
      - 'hub-client/src/pandoc/**'
      - 'hub-client/src/components/render/**'

# Pins copied from test-suite.yml (keep in step with it).
env:
  PANDOC_VERSION: "3.11"
  TYPST_VERSION: "0.15.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: q2-preview-spa E2E
    if: github.repository == 'quarto-dev/q2'
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # `project` is the Playwright project; `embed` is Chromium driving `q2 preview --ui editor`.
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: embed
            browser: chromium
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v2
        with:
          version: latest

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Install wasm-bindgen-cli
        run: |
          VERSION=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = |"/, ""); print; exit}' Cargo.lock)
          cargo install -f wasm-bindgen-cli --version "$VERSION"

      - name: Set up tree-sitter CLI
        run: |
          curl -LO https://github.com/tree-sitter/tree-sitter/releases/download/v0.25.8/tree-sitter-linux-x86.gz
          gunzip tree-sitter-linux-x86.gz
          chmod +x tree-sitter-linux-x86
          sudo mv tree-sitter-linux-x86 /usr/local/bin/tree-sitter

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Install binaryen (wasm-opt)
        run: npm install -g binaryen@132.0.0

      # The q2 binary embeds the WASM and both SPA dists at compile time,
      # so build them in this order before `cargo build`
      # (q2-preview-spa/e2e/README.md §1).
      - name: Build WASM
        run: npm run build:wasm
        working-directory: hub-client

      - name: Build trace-viewer
        run: npm run build
        working-directory: trace-viewer

      - name: Build q2-preview-spa
        run: npm run build
        working-directory: q2-preview-spa

      # The `embed` project needs the hub-client editor embedded in the binary: build it after the SPA
      # (the embed build dedupes its files against the viewer dist) and before `cargo build`, or build.rs
      # embeds a placeholder and the embed specs skip. About 4 GB of heap; it re-runs `build:wasm`.
      - name: Build the hub-client preview embed
        if: matrix.project == 'embed'
        run: cargo xtask build-hub-client-embed

      # globalSetup requires the debug binary at target/debug/q2.
      - name: Build q2
        run: cargo build --bin q2

      # The typst-pdf preview spec compiles with native typst and renders through native pandoc.
      - name: Set up Pandoc
        run: |
          curl -LO "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i "pandoc-${PANDOC_VERSION}-1-amd64.deb"

      - name: Set up Typst
        run: |
          curl -LO "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          tar -xf "typst-x86_64-unknown-linux-musl.tar.xz"
          sudo mv "typst-x86_64-unknown-linux-musl/typst" /usr/local/bin/typst

      - name: Install Playwright
        run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: q2-preview-spa

      - name: Run E2E tests
        run: npx playwright test --project=${{ matrix.project }}
        working-directory: q2-preview-spa

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: q2-preview-spa-results-${{ matrix.project }}
          path: |
            q2-preview-spa/test-results/
            q2-preview-spa/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
