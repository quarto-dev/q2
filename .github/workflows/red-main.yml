# File one GitHub issue per test that fails on main (bd-red-main-issues-fs4r6cp0).
#
# We never merge red, so every red run on main is a signal. The filer reads
# the failed run's logs and opens, comments on, or reopens one `red-main`
# issue per failing test (scripts/red-main/). See
# claude-notes/plans/2026-11-23-red-main-issue-filer.md.
#
# ROLLOUT: the `file` job runs with DRY_RUN=1 and only writes what it *would*
# do to the job summary. Flip DRY_RUN to '0' once a week of summaries looks
# right.

name: Red main filer

on:
  workflow_run:
    # Test-running workflows only. Keep in sync with WATCHED_WORKFLOWS in
    # scripts/red-main/file-issues.mjs (the script re-checks).
    workflows: ["Test Suite", "TS Test Suite", "Hub-Client E2E Tests"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Failed run id to file (or leave empty and set since)"
        required: false
      since:
        description: "Replay every failed main run since YYYY-MM-DD"
        required: false
      dry_run:
        description: "Dry run (write nothing)"
        type: boolean
        default: true
  pull_request:
    paths:
      - "scripts/red-main/**"
      - ".github/workflows/red-main.yml"

permissions: {}

jobs:
  test:
    name: Unit-test the filer
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: node --test scripts/red-main/*.test.mjs

  file:
    name: File red-main issues
    # workflow_run runs this file from the default branch with a write token.
    # It never checks out or runs the triggering run's code; it only reads
    # that run's logs. `head_branch == 'main'` alone is spoofable (a fork PR
    # from a branch named main), hence the event and repository guards.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'failure'
          && github.event.workflow_run.head_branch == 'main'
          && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event)
          && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    # No concurrency group on purpose: GitHub keeps only one *pending* run
    # per group, so a third red run arriving while one files and one waits
    # would be cancelled and never filed. Duplicates need the same test
    # failing in two workflows within seconds of each other, and the script
    # is idempotent per run attempt.
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: File issues
        env:
          GH_TOKEN: ${{ github.token }}
          # Rollout: dry run for automatic triggers until summaries look right.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && '1' || '0') || '1' }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          SINCE: ${{ inputs.since }}
        run: |
          if [ -n "$SINCE" ]; then
            node scripts/red-main/file-issues.mjs --repo "$GITHUB_REPOSITORY" --since "$SINCE"
          else
            node scripts/red-main/file-issues.mjs --repo "$GITHUB_REPOSITORY" --run "$RUN_ID"
          fi
