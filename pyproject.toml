# Python runtime for the Jupyter engine tests and smoke render.
# CI and local setup both install this locked, non-package project with uv.
[project]
name = "q2-engine-tests"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
    "jupyter-core",
    "ipykernel",
    "ipywidgets",
    "anywidget",
    "plotly",
    "great-tables",
    "polars",
    "pandas",
]

[tool.uv]
package = false
