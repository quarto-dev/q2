project:
  type: website
  # Staged example output for `.embed-example-iframe` embeds (bd-z1smhvuo).
  # `docs/examples/` is generated by `cargo xtask stage-doc-examples` and
  # gitignored; this copies it into `_site/examples/` so the iframes resolve.
  resources:
    - examples

