# wasmtime-c-api-impl (via tree-sitter's `wasm` feature, quarto-highlight's
# native user-grammar loader) drives a CMake build from its build.rs.
[tools.cmake]
version = "3.31.6"
url = "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz"
sha256 = "330b9514f5112e5ed4fb08b8b05803b776fd9b539a6ae12927d14dcc0ee2ba8d"
bin = "cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake"
env = "CMAKE"
packages = ["wasmtime-c-api-impl"]

# quarto-trace's build.rs runs git, which the sandbox can't. Release
# builds get the hash computed outside it (`--exclude=*` keeps describe
# from naming tags, so the format is `<hash>[-dirty]` as the build script
# produces); dev builds see `unknown`, so a commit doesn't rebuild
# quarto-trace and everything above it.
[env.QUARTO_GIT_HASH]
command = "git describe --always --dirty --abbrev=7 --exclude=*"
packages = ["quarto-trace"]
profiles = ["release"]

# insta's assert_*_snapshot! macros expand `env!("CARGO_MANIFEST_DIR")`
# into every test, which corgi rejects as a location leak. insta reads
# INSTA_WORKSPACE_ROOT at compile time instead when it is set. corgi
# compiles from the package root with package-relative paths (so
# `file!()` is package-relative) and runs tests there, so "." is
# correct at runtime and location-free. The scanner fills `packages`
# with every member that depends on insta.
[env.INSTA_WORKSPACE_ROOT]
command = "echo ."
packages = ["comrak-to-pandoc", "mitex-lexer", "mitex-parser", "pampa", "quarto", "quarto-analysis", "quarto-citeproc", "quarto-config", "quarto-core", "quarto-csl", "quarto-highlight", "quarto-lsp", "quarto-lsp-core", "quarto-math", "quarto-sass", "quarto-xml", "xtask"]

