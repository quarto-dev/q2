# claude-notes as a q2 website (bd-uk8zgkha).
#
# Only .md files render: `.qmd` files here are repro fixtures, and a
# positive render pattern replaces the default `**/*.qmd`.
project:
  type: website
  output-dir: _site
  render:
    - "**/*.md"
    # session-specific symlink to the active plan (gitignored)
    - "!plans/CURRENT.md"
    # repro fixtures that are meant to fail to parse (investigation inputs)
    - "!plans/code-span-backtick-run-investigation/cases/**"
    - "!research/2026-10-02-document-import-spike/losses.md"


website:
  title: "q2 claude-notes"
