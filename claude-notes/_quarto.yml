# claude-notes as a q2 website (bd-uk8zgkha).
#
# Only .md files render: `.qmd` files here are repro fixtures, and a
# positive render pattern replaces the default `**/*.qmd`.
project:
  type: website
  output-dir: _site
  render:
    - "**/*.md"
    # session-specific symlink to the active plan (gitignored)
    - "!plans/CURRENT.md"
    # repro fixtures that are meant to fail to parse, or to warn (investigation inputs)
    - "!plans/code-span-backtick-run-investigation/cases/**"
    - "!plans/reference-links-migration-investigation/q1probe*.md"
    - "!research/2026-10-02-document-import-spike/losses.md"
    - "!research/2026-10-02-document-import-spike/track-changes-source.md"
    # nested repro projects (their own _quarto.yml); q2 skips them anyway, with Q-5-31
    - "!plans/2026-08-11-lua-filter-returned-table-form-investigation/repro/**"
    - "!plans/heading-id-drops-inline-content-investigation/**"
    - "!plans/index-miss-relativize-investigation/repro/**"
    - "!plans/listing-declared-order-investigation/repro/**"
    - "!plans/listing-listjs-init-investigation/repro/**"
    - "!plans/listing-nesting-limit-investigation/repro/**"
    - "!plans/listing-table-fields-investigation/repro/**"
    - "!plans/llms-link-target-annotation-investigation/repro/**"
    - "!plans/sidebar-dir-index-md-investigation/repro/**"


website:
  title: "q2 claude-notes"
  navbar:
    left:
      - href: plans/index.md
        text: Plans
