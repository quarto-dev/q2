# Issue #1297 repro: a website page with every nav landmark q2 emits
# (navbar, secondary nav, breadcrumbs, sidebar, in-page TOC, page nav).
quarto-required: "^2"

project:
  type: website

website:
  title: "Landmarks"
  navbar:
    left:
      - href: index.qmd
        text: Home
  sidebar:
    contents:
      - index.qmd
      - section: "Guide"
        contents:
          - guide/one.qmd
          - guide/two.qmd
  page-navigation: true

format:
  html:
    toc: true
