<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowSolid" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1f2937"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="740" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">typst-testing epic — worktree / branch DAG</text>
  <text x="740" y="56" text-anchor="middle" font-size="13" fill="#4b5563">Time flows left → right. Each phase box is one topic branch, rebased onto and fast-forward-merged into feature/typst-testing.</text>

  <!-- Lane labels -->
  <text x="20" y="150" font-size="15" font-weight="700" fill="#2563eb">workspace-2</text>
  <text x="20" y="168" font-size="12" fill="#2563eb">Track A</text>

  <text x="20" y="400" font-size="15" font-weight="700" fill="#111827">workspace-3</text>
  <text x="20" y="418" font-size="12" fill="#111827">feature/typst-testing (integration)</text>

  <text x="20" y="660" font-size="15" font-weight="700" fill="#16a34a">workspace-5</text>
  <text x="20" y="678" font-size="12" fill="#16a34a">Track B</text>

  <!-- Lane guide lines -->
  <line x1="20" y1="200" x2="1460" y2="200" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="20" y1="460" x2="1460" y2="460" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="20" y1="720" x2="1460" y2="720" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Fan-out divider after P1/P2 -->
  <line x1="410" y1="90" x2="410" y2="760" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="416" y="100" font-size="11" fill="#6b7280">P1+P2 merged → tracks fan out</text>

  <!-- Convergence divider before P9 -->
  <line x1="1150" y1="90" x2="1150" y2="760" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="1156" y="100" font-size="11" fill="#6b7280">P5 + P8 both merged → tracks converge</text>

  <!-- Integration trunk line -->
  <line x1="70" y1="400" x2="1460" y2="400" stroke="#111827" stroke-width="2"/>

  <!-- P1 box (integration, bootstrap) -->
  <rect x="70" y="370" width="110" height="60" rx="8" fill="#111827"/>
  <text x="125" y="396" text-anchor="middle" font-size="15" font-weight="700" fill="white">P1</text>
  <text x="125" y="414" text-anchor="middle" font-size="10" fill="#d1d5db">assertion vocab</text>
  <line x1="180" y1="400" x2="230" y2="400" stroke="#111827" stroke-width="2" marker-end="url(#arrowSolid)"/>

  <!-- P2 box (integration, bootstrap) -->
  <rect x="230" y="370" width="110" height="60" rx="8" fill="#111827"/>
  <text x="285" y="396" text-anchor="middle" font-size="15" font-weight="700" fill="white">P2</text>
  <text x="285" y="414" text-anchor="middle" font-size="10" fill="#d1d5db">pdf-extract fork</text>

  <!-- Track A: P3 -> P4 -> P5 -->
  <rect x="460" y="120" width="110" height="60" rx="8" fill="#2563eb"/>
  <text x="515" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="white">P3</text>
  <text x="515" y="164" text-anchor="middle" font-size="10" fill="#dbeafe">struct-tree walk</text>
  <line x1="570" y1="150" x2="640" y2="150" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="640" y="120" width="110" height="60" rx="8" fill="#2563eb"/>
  <text x="695" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="white">P4</text>
  <text x="695" y="164" text-anchor="middle" font-size="10" fill="#dbeafe">standalone fixtures</text>
  <line x1="750" y1="150" x2="820" y2="150" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="820" y="120" width="110" height="60" rx="8" fill="#2563eb"/>
  <text x="875" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="white">P5</text>
  <text x="875" y="164" text-anchor="middle" font-size="10" fill="#dbeafe">margin-layout</text>

  <!-- Track B: P6 -> P7 -> P8 -->
  <rect x="460" y="620" width="110" height="60" rx="8" fill="#16a34a"/>
  <text x="515" y="646" text-anchor="middle" font-size="15" font-weight="700" fill="white">P6</text>
  <text x="515" y="664" text-anchor="middle" font-size="10" fill="#dcfce7">book harness</text>
  <line x1="570" y1="650" x2="640" y2="650" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="640" y="620" width="110" height="60" rx="8" fill="#16a34a"/>
  <text x="695" y="646" text-anchor="middle" font-size="15" font-weight="700" fill="white">P7</text>
  <text x="695" y="664" text-anchor="middle" font-size="10" fill="#dcfce7">override + lang</text>
  <line x1="750" y1="650" x2="850" y2="650" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="850" y="620" width="130" height="60" rx="8" fill="#16a34a"/>
  <text x="915" y="646" text-anchor="middle" font-size="15" font-weight="700" fill="white">P8</text>
  <text x="915" y="664" text-anchor="middle" font-size="10" fill="#dcfce7">orange-book base</text>

  <!-- Cross-track dependency: P3 must merge before P8 starts -->
  <path d="M 515,180 C 515,400 850,560 850,620" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowOrange)"/>
  <text x="700" y="470" font-size="11" fill="#ea580c" font-weight="600">P8 waits: P3 must be merged</text>
  <text x="700" y="485" font-size="11" fill="#ea580c" font-weight="600">into feature/typst-testing first</text>

  <!-- Merge arrows into trunk (dashed, colored by track) -->
  <path d="M 515,180 L 515,370" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowBlue)"/>
  <path d="M 695,180 L 695,370" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowBlue)"/>
  <path d="M 875,180 L 875,370" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowBlue)"/>

  <path d="M 515,620 L 515,430" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowGreen)"/>
  <path d="M 695,620 L 695,430" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowGreen)"/>
  <path d="M 915,620 L 915,430" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowGreen)"/>

  <text x="500" y="365" font-size="10" fill="#2563eb" text-anchor="middle">ff-merge</text>
  <text x="500" y="440" font-size="10" fill="#16a34a" text-anchor="middle">ff-merge</text>

  <!-- P9 box: needs P5 AND P8 merged -->
  <rect x="1180" y="370" width="130" height="60" rx="8" fill="#111827"/>
  <text x="1245" y="392" text-anchor="middle" font-size="15" font-weight="700" fill="white">P9</text>
  <text x="1245" y="408" text-anchor="middle" font-size="9.5" fill="#d1d5db">orange-book-margin</text>
  <text x="1245" y="421" text-anchor="middle" font-size="9" fill="#9ca3af">workspace-2 or -5</text>

  <line x1="340" y1="400" x2="410" y2="400" stroke="#111827" stroke-width="2" marker-end="url(#arrowSolid)"/>
  <line x1="1150" y1="400" x2="1180" y2="400" stroke="#111827" stroke-width="2" marker-end="url(#arrowSolid)"/>

  <!-- P10 box -->
  <rect x="1330" y="370" width="120" height="60" rx="8" fill="#111827"/>
  <text x="1390" y="396" text-anchor="middle" font-size="15" font-weight="700" fill="white">P10</text>
  <text x="1390" y="414" text-anchor="middle" font-size="10" fill="#d1d5db">reconcile</text>
  <line x1="1310" y1="400" x2="1330" y2="400" stroke="#111827" stroke-width="2" marker-end="url(#arrowSolid)"/>

  <!-- Legend -->
  <g transform="translate(70,790)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#111827" stroke-width="2" marker-end="url(#arrowSolid)"/>
    <text x="38" y="4" font-size="12" fill="#374151">sequential work, same worktree/branch chain</text>

    <line x1="0" y1="25" x2="30" y2="25" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowBlue)"/>
    <text x="38" y="29" font-size="12" fill="#374151">rebase + git merge --ff-only into feature/typst-testing</text>

    <line x1="0" y1="50" x2="30" y2="50" stroke="#ea580c" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowOrange)"/>
    <text x="38" y="54" font-size="12" fill="#374151">cross-track blocking dependency (must be merged first, not just started)</text>
  </g>
</svg>
