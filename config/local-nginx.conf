# Local development nginx config for quarto-hub
# Mirrors production setup but without TLS
# NOTE: This file is loaded dynamically by scripts/local-prod-nginx.sh with DIST_PATH substitution

# Map WebSocket upgrade header to connection type
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# q2-sandboxed-preview server on separate port (simulates separate domain in production)
server {
    listen 8081;
    server_name localhost;

    # Strict security headers for sandboxed iframe content
    add_header X-Frame-Options ALLOWALL always;
    add_header X-Content-Type-Options nosniff always;

    # No caching for q2-sandboxed-preview.html
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}

server {
    listen 8080;
    server_name localhost;

    # Security headers (same as production)
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_vary on;
    gzip_min_length 256;

    # WebSocket proxy to hub
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Vite hashed assets — cache indefinitely (content hash in filename)
    location /assets/ {
        alias DIST_PATH/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Quarto project artifacts (CSS, JS generated during preview/render)
    # Use ^~ to stop searching after this match (priority over regex and / location)
    location ^~ /.quarto/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API/auth proxy to hub
    location ~ ^/(auth|api|health) {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static client assets (index.html, favicon, etc.) — always revalidate
    location / {
        root DIST_PATH;
        # Try the file, then as directory, then fallback to index.html for SPA routing
        # Files with extensions (like .css, .js) will 404 if not found (correct behavior)
        try_files $uri $uri/ /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
