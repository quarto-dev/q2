# Registry of vendored third-party assets (bd-xm7l).
#
# Every third-party file the repo ships or embeds without a package manager
# managing it is listed here: what it is, where it lives, which version it is
# at, and what decides that version. HOW to refresh an asset stays in the
# README next to its bytes (`procedure`); this file is the index.
#
# Checked offline by `cargo xtask lint` (rule `vendored-registry`, see
# crates/xtask/src/lint/vendored_registry.rs) and surveyed online by
# `cargo xtask vendored outdated` and the `/upgrade-vendored-deps` skill.
#
# Adding a vendored asset? Add an `[[asset]]` here. The lint fails on any
# committed file under a `[coverage]` root that no asset claims.
#
# ---------------------------------------------------------------------------
# Asset fields
#
#   id, title       required. `id` is kebab-case and unique.
#   paths           required. Repo-relative files/directories the asset owns.
#   policy          required. One of:
#                     track    — compare against `upstream`.
#                     follow   — `follows` (another asset id) decides the
#                                version; surveyed together with it.
#                     frozen   — deliberately never updated (fixtures).
#                     native   — repo-owned; listed so coverage/discovery
#                                stop flagging it.
#                     external — managed elsewhere (Cargo [patch], PINS.md).
#   group           reporting key: a survey files one strand per group.
#   version         pinned version, or the upstream git ref for `git`
#                   upstreams with `paths`. "*" = deliberately unpinned.
#                   Absent = unrecorded (an inventory gap the survey reports).
#   version_sources places in the tree that must agree with `version`:
#                     { kind = "file-contains", file = "…" }
#                     { kind = "file-regex", file = "…", regex = '…(capture)…' }
#                     { kind = "json-key", file = "…", key = "a.b" }
#                       (or key = ["a", "b.c"] when a segment has a dot)
#                     { kind = "path-segment" }    # a component of paths[0]
#                     { kind = "subtree-split" }   # git-subtree-split trailer;
#                                                  # checked by `outdated` only
#   upstream        { kind = "npm", package = "…" }
#                   { kind = "typst-universe", package = "…" }
#                   { kind = "crates-io", crate = "…" }
#                   { kind = "git", repo = "…", track = "tags" | { branch = "…" },
#                     tag_prefix = "v", paths = ["upstream/path", …] }
#                   With `paths`, "outdated" means those upstream paths changed
#                   between `version` and the latest ref — not merely that a
#                   newer ref exists.
#   copy_of         a directory paths[0] copies: every file under paths[0]
#                   must be byte-identical to the same file there (the
#                   source may hold more, e.g. a package's template/).
#   guards          tests that guard the asset ("<crate> <test>").
#   procedure       where the refresh steps are documented (file[#anchor]).
#   license         SPDX-ish.
#   last_reviewed   YYYY-MM-DD of the last survey that checked it.
#   notes           free-form context for the agent doing an upgrade: local
#                   patches, coupling, gotchas, what "newer" does NOT mean.
# ---------------------------------------------------------------------------

[coverage]
roots = ["resources", "hub-client/public", "crates/*/vendor"]

[[group]]
id = "quarto-cli"
title = "Assets copied from quarto-cli (Quarto 1)"
notes = '''
Not one pin: each asset records the quarto-cli ref it was copied (or
verified byte-identical) at. A quarto-cli release is a reason to *look*, and
`outdated` reports which copied paths actually changed since each asset's
ref. Several copies carry local q2 patches; read each asset's notes before
re-copying. `external-sources/quarto-cli` is a convenient local checkout for
diffing but is never referenced by the build (External Sources Policy).
'''

[[group]]
id = "bootstrap"
title = "Bootstrap SCSS / JS / Icons"
notes = "Bootstrap SCSS and JS must move together (bootstrap_js_version_matches_scss_readme)."

[[group]]
id = "reveal-js"
title = "reveal.js runtime, theme template and plugins"
notes = '''
The vendored dist must match the `reveal.js` npm pin in the root,
hub-client and preview-renderer package.json files
(vendored_reveal_assets_match_npm_package). Bump npm first, then re-copy.
'''

[[group]]
id = "typst"
title = "Typst packages, subtrees and the Typst WASM stack"

[[group]]
id = "pandoc"
title = "Pandoc-derived assets"

[[group]]
id = "cdn"
title = "Libraries loaded from a CDN at page load (not vendored bytes)"
notes = '''
These are URLs in Rust string literals, not committed files. Pinned ones
have an exact version in the URL; "*" ones float on the CDN's latest, which
means rendered output can change under users without a q2 release.
'''

[[group]]
id = "rust-vendored"
title = "Vendored or forked Rust crates"

