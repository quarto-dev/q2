These follow quarto-cli, NOT Typst Universe: a newer showybox on
packages.typst.org is not by itself a reason to update. Only the import
working set is vendored (typst.toml, the .typ closure, LICENSE/README);
`template/` and `thumbnail.png` exist only for `typst init` and stay out.
Directory names carry the version (`preview/<name>/<version>/`), so a bump is
a rename plus the `@preview/<name>:<version>` imports in pandoc-filters'
Lua and typst-template, which must change in the same commit.
'''

