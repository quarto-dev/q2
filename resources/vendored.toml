[[asset]]
id = "pandoc-filters"
title = "Quarto 1 Lua filter stack, pandoc datadir and Typst template partials"
paths = ["resources/pandoc-filters"]
policy = "track"
group = "quarto-cli"
version = "v1.11.6"
version_sources = [{ kind = "file-contains", file = "resources/pandoc-filters/README.md" }]
upstream = { kind = "git", repo = "https://github.com/quarto-dev/quarto-cli", track = "tags", tag_prefix = "v", paths = [
  "src/resources/filters",
  "src/resources/pandoc/datadir",
  "src/resources/formats/typst/pandoc/quarto",
] }
guards = [
  "xtask lint::vendored_pandoc_filters",
  "xtask lint::pandoc_pin",
  "quarto-core pandoc_transport / pandoc_typst_writer integration tests",
]
procedure = "resources/pandoc-filters/README.md#updating"
license = "GPL-2.0"
last_reviewed = "2026-10-21"
notes = '''
The README's "Ours vs. pinned" section lists q2-only files and patches
(quarto2-shim.lua, crossref patches, …) that a delete-and-recopy would lose;
the vendored-pandoc-filters lint checks they exist. The filters are pinned
together with a pandoc version (PANDOC_PIN in
crates/quarto-core/src/pandoc_filters/mod.rs, checked by the pandoc-pin
lint); a quarto-cli bump that requires a newer pandoc also moves
`pandoc-wasm`. callout.lua and theorem.lua emit `@preview/...` Typst imports:
if a re-copy changes those versions, `typst-packages` must move too (the
typst hermeticity test in quarto-core fails until it does).
'''

