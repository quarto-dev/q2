<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block annotation mockups</title>
<style>
:root { --ink:#212529; --muted:#6c757d; --faint:#adb5bd; --line:#dee2e6; --accent:#2780e3; --chrome:#f6f7f9;
  --chip:#eef0f3; --chip-hover:#e2e6ea; --sel:#9ec5f0; --sel-bg:#e7f1fc; --sel-ink:#145ca8; }
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:#fff; }
.app { display:grid; grid-template-columns: 260px 1fr 300px; height:100vh; }
.app.nosrc { grid-template-columns: 260px 1fr; }
.app.nosrc .source { display:none; }
aside { background:var(--chrome); border-right:1px solid var(--line); padding:16px; overflow:auto; font-size:14px; }
aside h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:18px 0 8px; }
aside h2:first-child { margin-top:0; }
.opt { display:block; padding:8px 10px; border-radius:6px; cursor:pointer; margin-bottom:4px; }
.opt:hover { background:#eceef1; }
.opt.on { background:#fff; box-shadow:0 0 0 1px var(--line); }
.opt b { display:block; font-weight:600; }
.opt span { color:var(--muted); font-size:12.5px; line-height:1.35; display:block; margin-top:2px; }
.opt span.why { font-style:italic; color:#8a6d00; }
details.archived { margin-top:22px; border-top:1px solid var(--line); padding-top:12px; }
details.archived summary { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); cursor:pointer; margin-bottom:8px; }

/* Toolbar (Extras), Word / Google Docs style. */
.toolbar { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:7px 16px; border-bottom:1px solid var(--line); background:#fff; }
.toolbar .tb-main { display:flex; gap:3px; align-items:center; }
/* Crumbs that don't fit are clipped at the far (outer) end. */
.toolbar .tb-crumbs { display:flex; justify-content:flex-end; align-items:center; gap:1px; min-width:0; overflow:hidden; white-space:nowrap; }
.toolbar[hidden] { display:none; }
.toolbar button { font:13px system-ui, sans-serif; border:1px solid transparent; background:none; padding:4px 9px; border-radius:5px; cursor:pointer; color:#343a40; display:inline-flex; align-items:center; gap:6px; }
.toolbar button:hover:not(:disabled) { background:#f1f3f5; }
.toolbar button:disabled { color:var(--faint); cursor:default; }
.toolbar button[aria-pressed="true"] { background:var(--sel-bg); border-color:#c5dcf5; color:var(--sel-ink); }
.toolbar .style { width:150px; justify-content:space-between; border-color:var(--line); }
.toolbar .style > span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.toolbar .style.open { background:#f1f3f5; }
.toolbar .style svg { width:8px; height:8px; }
.toolbar button.icon { padding:4px; position:relative; color:#444746; }
.toolbar button.icon svg { width:20px; height:20px; display:block; }
/* Tooltips: shown under the button on hover, after a short delay. */
.toolbar button.icon::after { content:attr(data-tip); position:absolute; top:calc(100% + 6px); left:50%; transform:translateX(-50%);
  background:#343a40; color:#fff; font:12px/1 system-ui, sans-serif; padding:5px 7px; border-radius:4px; white-space:nowrap;
  pointer-events:none; visibility:hidden; z-index:20; }
.toolbar button.icon:hover::after { visibility:visible; transition:visibility 0s .35s; }
.toolbar .sep { width:1px; height:20px; background:var(--line); margin:0 6px; }
/* The style box as a breadcrumb: containers as plain crumbs, then the box. */
.toolbar .crumb { padding:4px 6px; color:#5c636a; }
.toolbar .crumb svg { width:8px; height:8px; }
.toolbar .crumb.open { background:#f1f3f5; }
.toolbar .crumbsep { color:#c3c9cf; padding:0 1px; font-size:13px; }
.radio { display:flex; gap:6px; align-items:center; padding:3px 2px; cursor:pointer; }
.reset { margin-top:12px; font:inherit; font-size:13px; padding:4px 10px; border:1px solid var(--line); background:#fff; border-radius:5px; cursor:pointer; }
.center { display:flex; flex-direction:column; min-width:0; min-height:0; }
.scroller { flex:1; overflow:auto; }
.tips { max-width:760px; margin:16px auto 0; padding:9px 14px; background:#fff8e1; border:1px solid #f3e1a6; border-radius:6px; font-size:13px; color:#5c4b00; line-height:1.5; }
kbd { font:11.5px ui-monospace, Menlo, monospace; border:1px solid #d9c98f; border-bottom-width:2px; border-radius:3px; padding:0 4px; background:#fffdf3; }
.source { border-left:1px solid var(--line); background:var(--chrome); padding:16px; overflow:auto; }
.source h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px; }
.source pre { font:12.5px/1.5 ui-monospace, Menlo, monospace; white-space:pre-wrap; margin:0; }
.source .hov { background:#eef0f3; }
.source .cur { background:var(--sel-bg); }

/* The document. Gutters either side of the text leave room for the
   annotations, which are laid over the page (.overlay) rather than put in
   the editable DOM, so they never become part of what you edit. */
.page { position:relative; max-width:1060px; margin:0 auto; padding:44px 100px 160px; }
.page.v-gutter, .page.v-chip, .page.v-chipbr, .page.v-bracket { padding-left:210px; }
.page.v-margin { padding-right:210px; }
.body { outline:none; font-size:17px; line-height:1.5; }
.body > :first-child { margin-top:0; }
.body p { margin:0 0 17px; }
.body h1 { font-size:2rem; font-weight:600; line-height:1.2; margin:1.5rem 0 1rem; border-bottom:1px solid var(--line); padding-bottom:.3rem; }
.body h2 { font-size:1.6rem; font-weight:600; line-height:1.2; margin:1.5rem 0 .75rem; border-bottom:1px solid var(--line); padding-bottom:.25rem; }
.body h3 { font-size:1.35rem; font-weight:600; line-height:1.2; margin:1.25rem 0 .6rem; }
.body h4 { font-size:1.15rem; font-weight:600; line-height:1.2; margin:1.25rem 0 .5rem; }
.body ul, .body ol { margin:0 0 17px; padding-left:2rem; }
.body blockquote { margin:0 0 17px; padding:0 0 0 1rem; border-left:3px solid var(--line); color:#5c636a; }
.body blockquote p, .body .callout p { margin:0 0 .5rem; }
.body blockquote > :last-child, .body .callout > :last-child { margin-bottom:0; }
.body pre { background:#f8f9fa; border:1px solid var(--line); padding:.6rem .8rem; border-radius:4px; font:14px/1.5 ui-monospace, Menlo, monospace; margin:0 0 17px; white-space:pre-wrap; }
.callout { --c:#2780e3; --cbg:#eef5fd; border-left:4px solid var(--c); background:var(--cbg); padding:.6rem 1rem; margin:0 0 17px; border-radius:4px; }
.callout::before { content:attr(data-kind); display:block; font-weight:600; text-transform:capitalize; color:var(--c); font-size:15px; margin-bottom:.25rem; }
.callout[data-kind="tip"] { --c:#2f8a12; --cbg:#eff9ec; }
.callout[data-kind="warning"] { --c:#c95400; --cbg:#fff3eb; }
.callout[data-kind="important"] { --c:#d6002f; --cbg:#ffeef1; }

/* ---- annotations ---- */
.overlay { position:absolute; inset:0; pointer-events:none; z-index:3; }
.ann { position:absolute; display:flex; align-items:center; gap:1px; white-space:nowrap; font:12px/16px system-ui, -apple-system, sans-serif; pointer-events:auto; }
.ann.caret { color:#5c636a; }
.ann.hover { color:#9aa1a8; }
.ann.idle { color:#c3c9cf; }
.md .ann, .md .crumbs .chip { font-family: ui-monospace, Menlo, monospace; font-size:11.5px; }
.ann .sep, .crumbs .sep { color:#c3c9cf; padding:0 2px; }
.chip { all:unset; display:inline-flex; align-items:center; gap:3px; padding:2px 6px; border-radius:4px; cursor:pointer; }
.chip svg { width:8px; height:8px; flex:none; }
.chip:hover, .chip.open { background:var(--chip-hover); color:var(--ink); }

/* Gutter label: passive text. */
.v-gutter .ann { pointer-events:none; }

/* Gutter chip: a button and a drag handle. */
.v-chip .ann.caret .chip { background:var(--chip); }
.v-chip .ann.caret .chip:hover, .v-chip .chip.open { background:var(--chip-hover); }
.handle { display:inline-flex; width:16px; height:20px; align-items:center; justify-content:center; cursor:grab; border-radius:3px; color:#b5bcc3; margin-right:2px; }
.handle:hover { background:var(--chip); color:var(--ink); }
.handle svg { width:8px; height:14px; }
body.dragging, body.dragging * { cursor:grabbing !important; }

/* Right margin: text until hovered; the chevron shows on hover. */
.v-margin .chip svg { visibility:hidden; }
.v-margin .chip:hover svg, .v-margin .chip.open svg { visibility:visible; }

/* Outline + tab. */
.box { position:absolute; border:1px solid; border-radius:4px; pointer-events:none; }
.box.caret { border-color:var(--sel); }
.box.hover { border-color:#ced4da; }
.box.idle { border-color:#eceef1; }
.box.aim { border:2px solid var(--accent); }
.v-tab .ann { padding:0 2px; border:1px solid; border-bottom:0; border-radius:4px 4px 0 0; background:#fff; }
.v-tab .ann.caret { border-color:var(--sel); background:var(--sel-bg); color:var(--sel-ink); }
.v-tab .ann.hover { border-color:#ced4da; background:#f8f9fa; }
.v-tab .ann.idle { border-color:#eceef1; }
.v-tab .chip { padding:1px 4px; }
.v-tab .chip:hover, .v-tab .chip.open { background:none; text-decoration:underline; color:inherit; }

/* Bracket. */
.brk { position:absolute; width:6px; border:2px solid; border-right:0; border-radius:3px 0 0 3px; pointer-events:none; }
.brk.caret { border-color:#8fa3b8; }
.brk.hover { border-color:#d3d8dd; }
.brk.idle { border-color:#eceef1; }
.brk.aim { border-color:var(--accent); }
.v-bracket .chip { padding:1px 4px; }

/* Chip + bracket: like the gutter chip; the chip pointed at is "aimed". */
.v-chipbr .ann.caret .chip { background:var(--chip); }
.v-chipbr .chip.aim, .v-chipbr .chip.open { background:var(--sel-bg) !important; color:var(--sel-ink); }

/* Breadcrumb bar under the document. */
.crumbs { display:none; border-top:1px solid var(--line); background:var(--chrome); padding:5px 12px; font:12.5px/18px system-ui, sans-serif; align-items:center; min-height:34px; color:#5c636a; }
.app.crumbs-on .crumbs { display:flex; }
.crumbs .none { color:var(--faint); padding:0 6px; }

/* Highlight of the block a menu or drag acts on; drop position. */
.hl { position:absolute; border:2px solid var(--sel); border-radius:5px; pointer-events:none; }
.drop { position:absolute; height:2px; background:var(--accent); border-radius:1px; pointer-events:none; }

/* Block menu. */
.menu { position:fixed; z-index:10; width:230px; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 6px 24px rgba(0,0,0,.12); padding:5px; font-size:13.5px; }
.menu .grp { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:7px 8px 3px; }
.menu .item { padding:5px 8px 5px 26px; border-radius:5px; cursor:pointer; display:flex; justify-content:space-between; position:relative; }
.menu .item.on::before { content:"✓"; position:absolute; left:9px; color:var(--sel-ink); }
.menu .item small { color:var(--muted); font-family:ui-monospace, Menlo, monospace; }
.menu .item.sel { background:var(--sel-bg); }
.menu .item.off { color:var(--faint); cursor:default; }
.menu hr { border:0; border-top:1px solid var(--line); margin:4px 0; }
</style>
</head>
<body>
<div class="app" id="app">
  <aside id="side"></aside>
  <div class="center">
    <div class="toolbar" id="toolbar" hidden></div>
    <div class="scroller" id="scroller">
      <div class="tips" id="tips"></div>
      <div class="page" id="page">
        <div class="body" id="body" contenteditable="true" spellcheck="false"></div>
        <div class="overlay" id="overlay"></div>
      </div>
    </div>
    <div class="crumbs" id="crumbs"></div>
  </div>
  <div class="source"><h2>Source the editor would write</h2><pre id="source"></pre></div>
</div>
<div class="menu" id="menu" hidden></div>
<script>
const VARIANTS = {
  chipbr: { name: 'Chip + bracket', desc: 'A chip and drag handle in the left margin, and a bracket down the extent of the block they act on.',
    tips: 'In the callout, hover each chip of “Callout › Paragraph”: the bracket moves to the block that chip acts on. Click a chip for its menu; drag <b>⠿</b> to move the block you last pointed at among its siblings.' },
  none: { name: 'Nothing', desc: 'No margin affordance: with the toolbar on, try the toolbar alone.',
    tips: 'Turn on <b>Toolbar</b> (under Extras) to change blocks from there.' },
  gutter: { name: 'Gutter label', desc: 'Quiet text in the left margin, level with the block’s first line. It only says what the block is.',
    archived: 'Passive: if it’s there, it might as well do something.',
    tips: 'Hover a block or put the caret in it. The label is passive; <kbd>⌘/</kbd> still opens the block menu.' },
  chip: { name: 'Gutter chip + handle', desc: 'A button in the left margin, with a drag handle. Click it to turn the block into another type, or move it.',
    archived: 'Once blocks nest, nothing shows which block it targets. Became Chip + bracket.',
    tips: 'Click the chip for the block menu. Drag <b>⠿</b> to move the block among its siblings (within a callout, it stays in the callout).' },
  margin: { name: 'Right-margin label', desc: 'The same button in the right margin, away from where each line starts. Text until you hover it.',
    archived: 'The left margin feels more familiar.',
    tips: 'Hover a block or put the caret in it, then click its label in the right margin.' },
  tab: { name: 'Outline + tab', desc: 'Outlines the block and hangs its type on a tab at its top-left corner, so you also see where it starts and ends.',
    archived: 'A whole rectangle of ink that is nearly always full width, so it says no more than a bracket.',
    tips: 'Try <b>Nesting: all levels</b> with the caret in the callout or the quote: each level gets an outline.' },
  bracket: { name: 'Bracket', desc: 'A thin bracket down the left edge shows the block’s extent; nested blocks get nested brackets, like code-folding guides.',
    archived: 'Folded into Chip + bracket.',
    tips: 'Try <b>Nesting: all levels</b> in the callout; the label sits left of the brackets.' },
};
const LABELS = { name: 'Name (Heading 2)', short: 'Short (H2)', md: 'Markdown (##)' };
const SHOWS = { focus: 'Hover and caret', caret: 'Caret only', always: 'Always' };
const NESTS = { inner: 'Innermost block', all: 'All levels' };
const TBMARKS = { brackets: 'Nested brackets', outlines: 'Nested outlines' };
const QUIETS = { show: 'Keep showing', hide: 'Hide until the mouse moves', faint: 'Only a faint bracket until the mouse moves' };
const TBCRUMBS_TIP = ' The style box is the last crumb of a breadcrumb of the blocks the caret is in: hover a crumb to bracket its block in the margin; click it for its menu. Try it with <b>Nothing</b> in the margin.';
const TOOLBAR_TIP = ' The toolbar follows the caret: its style box shows the caret’s text block, and the list, quote and callout buttons light up when the caret is inside one (click again to undo).';
const GENERAL = ' <kbd>⌘/</kbd> or <kbd>Ctrl /</kbd> opens the menu for the caret’s block (<kbd>↑</kbd><kbd>↓</kbd> <kbd>Enter</kbd> <kbd>Esc</kbd>). <kbd>⌥↑</kbd><kbd>⌥↓</kbd> move it.';

const FIXTURE = `
<h1>Palmer penguins</h1>
<p>Three species of penguin were measured over three seasons on islands near Palmer Station, Antarctica.</p>
<h2>Data</h2>
<p>Each row is one penguin: its species, island, bill and flipper measurements, body mass and sex.</p>
<pre data-lang="python">import pandas as pd
penguins = pd.read_csv("penguins.csv")
penguins.head()</pre>
<h3>Species</h3>
<ul><li>Adélie</li><li>Chinstrap</li><li>Gentoo</li></ul>
<div class="callout" data-kind="note"><p>Rows with missing measurements were dropped before plotting.</p><p>The appendix lists them.</p></div>
<h2>Findings</h2>
<p>Gentoo penguins are the heaviest of the three, and their flippers are the longest.</p>
<blockquote><p>A drop-in replacement for the iris dataset, with more character.</p></blockquote>
<h3>Next steps</h3>
<ol><li>Fit a model of body mass on flipper length.</li><li>Check it for each species.</li></ol>
<h4>Caveats</h4>
<p>Three seasons is a short window.</p>`.replace(/>\s+</g, '><').trim();

const SEL = 'p,h1,h2,h3,h4,h5,h6,ul,ol,blockquote,.callout,pre';
const CALLOUTS = ['note', 'tip', 'warning', 'important'];
const LANGS = { python: 'Python', r: 'R', julia: 'Julia' };
const CHEV = '<svg viewBox="0 0 8 8"><path d="M1 2.5 4 5.5 7 2.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>';
const GRIP = '<svg viewBox="0 0 8 14"><g fill="currentColor"><circle cx="2" cy="2" r="1.2"/><circle cx="6" cy="2" r="1.2"/><circle cx="2" cy="7" r="1.2"/><circle cx="6" cy="7" r="1.2"/><circle cx="2" cy="12" r="1.2"/><circle cx="6" cy="12" r="1.2"/></g></svg>';

const $ = (id) => document.getElementById(id);
const app = $('app'), page = $('page'), body = $('body'), overlay = $('overlay'), crumbs = $('crumbs'), menuEl = $('menu');
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cap = (s) => s[0].toUpperCase() + s.slice(1);
document.execCommand('defaultParagraphSeparator', false, 'p');

// ---- state --------------------------------------------------------------
const params = new URLSearchParams(location.hash.slice(1));
const pick = (k, set, d) => (set[params.get(k)] ? params.get(k) : d);
const flag = (k, d) => (params.has(k) ? params.get(k) === '1' : d);
const state = {
  v: pick('v', VARIANTS, 'chipbr'), label: pick('label', LABELS, 'name'),
  show: pick('show', SHOWS, 'focus'), nest: pick('nest', NESTS, 'all'), quiet: pick('quiet', QUIETS, 'hide'), tbmark: pick('tbmark', TBMARKS, 'brackets'),
  tb: flag('tb', false), tbcrumbs: flag('tbcrumbs', false), crumbs: flag('crumbs', false), src: flag('src', true),
};
// `chipHover`: the block whose chip the pointer is on (or last was, in its label).
// `typing`: set by a keystroke that edits, cleared when the mouse moves.
let lastHov = [], overAnn = false, tbHover = null;
let mouse = null, menu = null, drag = null, crumbHover = null, chipHover = null, typing = false;

function saveHash() {
  const b = (x) => (x ? '1' : '0');
  location.replace('#' + new URLSearchParams({ v: state.v, label: state.label, show: state.show, nest: state.nest, quiet: state.quiet, tbmark: state.tbmark, tb: b(state.tb), tbcrumbs: b(state.tbcrumbs), crumbs: b(state.crumbs), src: b(state.src) }));
}

function renderSide() {
  const side = $('side');
  side.innerHTML = '<h2>In the margin</h2>';
  const card = (k, o, into) => {
    const d = document.createElement('div');
    d.className = 'opt' + (k === state.v ? ' on' : '');
    d.innerHTML = `<b>${o.name}</b><span>${o.desc}</span>` + (o.archived ? `<span class="why">${o.archived}</span>` : '');
    d.onclick = () => { state.v = k; apply(); };
    into.append(d);
  };
  for (const [k, o] of Object.entries(VARIANTS)) if (!o.archived) card(k, o, side);
  const checks = (title, items) => {
    const h = document.createElement('h2'); h.textContent = title; side.append(h);
    for (const [key, name] of items) {
      const l = document.createElement('label'); l.className = 'radio';
      l.innerHTML = `<input type="checkbox" ${state[key] ? 'checked' : ''}> ${name}`;
      l.querySelector('input').onchange = (e) => {
        state[key] = e.target.checked;
        if (key === 'tbcrumbs' && state.tbcrumbs) state.tb = true;
        if (key === 'tb' && !state.tb) state.tbcrumbs = false;
        apply();
      };
      side.append(l);
    }
  };
  checks('Extras', [['tb', 'Toolbar'], ['tbcrumbs', 'Toolbar style box as breadcrumb'], ['crumbs', 'Breadcrumb bar']]);
  const radios = (title, key, set) => {
    const h = document.createElement('h2'); h.textContent = title; side.append(h);
    for (const [k, name] of Object.entries(set)) {
      const l = document.createElement('label'); l.className = 'radio';
      l.innerHTML = `<input type="radio" name="${key}" ${state[key] === k ? 'checked' : ''}> ${name}`;
      l.querySelector('input').onchange = () => { state[key] = k; apply(); };
      side.append(l);
    }
  };
  radios('Toolbar breadcrumb hover', 'tbmark', TBMARKS);
  radios('Label', 'label', LABELS);
  radios('Show on', 'show', SHOWS);
  radios('Nesting', 'nest', NESTS);
  radios('While typing', 'quiet', QUIETS);
  checks('Panels', [['src', 'Show source']]);
  const r = document.createElement('button'); r.className = 'reset'; r.textContent = 'Reset document';
  r.onclick = () => { closeMenu(); body.innerHTML = FIXTURE; update(); };
  side.append(r);
  const arch = document.createElement('details'); arch.className = 'archived';
  arch.open = !!VARIANTS[state.v].archived;
  arch.innerHTML = '<summary>Archived</summary>';
  for (const [k, o] of Object.entries(VARIANTS)) if (o.archived) card(k, o, arch);
  side.append(arch);
}

function apply() {
  saveHash(); closeMenu(); renderSide();
  $('tips').innerHTML = VARIANTS[state.v].tips + GENERAL + (state.tb ? TOOLBAR_TIP : '') + (state.tbcrumbs ? TBCRUMBS_TIP : '');
  app.classList.toggle('nosrc', !state.src);
  app.classList.toggle('crumbs-on', state.crumbs);
  $('toolbar').hidden = !state.tb;
  app.classList.toggle('md', state.label === 'md');
  page.className = 'page v-' + state.v;
  for (const e of live.values()) e.remove();
  live.clear();
  schedule();
}

// ---- blocks -------------------------------------------------------------
function kind(b) {
  const t = b.tagName;
  if (/^H[1-6]$/.test(t)) return 'h' + t[1];
  if (t === 'P') return 'p';
  if (t === 'UL') return 'ul';
  if (t === 'OL') return 'ol';
  if (t === 'BLOCKQUOTE') return 'quote';
  if (t === 'PRE') return 'code';
  if (b.classList.contains('callout')) return 'callout';
  return 'p';
}
function label(b, mode = state.label) {
  const k = kind(b);
  if (/^h\d$/.test(k)) return { name: 'Heading ' + k[1], short: 'H' + k[1], md: '#'.repeat(+k[1]) }[mode];
  const ck = b.dataset.kind || 'note', l = b.dataset.lang || 'python';
  return {

    `<button class="crumb${menu && menu.anchor === 'crumb' && menu.target === b ? ' open' : ''}" data-tb="crumb" data-id="${id(b)}">${esc(label(b))}${CHEV}</button><span class="crumbsep">›</span>`).join('') : '';
  const styleOff = none || (c.code && !state.tbcrumbs);
  const styleText = state.tbcrumbs && c.code ? label(c.code) : style;
  // Three columns: the crumbs grow leftwards from the style box, so the
  // style box and the buttons never move as the caret's nesting changes.
  setHTML($('toolbar'), `<div class="tb-crumbs">${crumbsHTML}</div><div class="tb-main">` + [
    `<button data-tb="style" class="style${menu && menu.anchor === 'style' ? ' open' : ''}" ${styleOff ? 'disabled' : ''}><span>${esc(styleText)}</span>${CHEV}</button>`,
    '<span class="sep"></span>',
    btn('ul', 'Bulleted list', c.list && kind(c.list) === 'ul', none || c.code),
    btn('ol', 'Numbered list', c.list && kind(c.list) === 'ol', none || c.code),
    btn('quote', 'Quote', c.quote, none || c.code),
    '<span class="sep"></span>',
    btn('callout', 'Callout', c.callout, none || c.code),
    btn('code', 'Insert code cell', false, false),
  ].join('') + '</div><div></div>');
}
function onToolbar(k, anchor) {
  const c = caretContext();
  if (k === 'crumb') {
    const b = byId.get(+anchor.dataset.id);
    if (menu && menu.target === b && menu.anchor === 'crumb') return closeMenu();
    openMenu(b, { anchor });
    Object.assign(menu, { anchor: 'crumb', fromToolbar: true });
    return render();
  }
  if (k === 'style' && c.code) {
    if (menu && menu.anchor === 'style') return closeMenu();
    openMenu(c.code, { anchor });
    Object.assign(menu, { anchor: 'style', fromToolbar: true });
    return render();
  }
  if (k === 'style') {
    if (menu && menu.anchor === 'style') return closeMenu();
    const T = (name, t, css) => ({ label: name, on: c.text && kind(c.text) === t, off: !c.text, css, run: () => convert(c.text, t) });
    openMenu(c.text || c.list, {
      anchor, title: null,
      items: [T('Paragraph', 'p', ''), T('Heading 1', 'h1', 'font-size:20px;font-weight:600'), T('Heading 2', 'h2', 'font-size:18px;font-weight:600'),
        T('Heading 3', 'h3', 'font-size:16px;font-weight:600'), T('Heading 4', 'h4', 'font-size:14.5px;font-weight:600')],
    });
    Object.assign(menu, { anchor: 'style', fromToolbar: true });
    return render();
  }
  closeMenu();
  if (k === 'code') {
    const pre = mk('pre'); pre.dataset.lang = 'python'; pre.innerHTML = '<br>';
    if (c.car[0]) c.car[0].after(pre); else body.append(pre);
    body.focus();
    const r = document.createRange(); r.setStart(pre, 0); getSelection().removeAllRanges(); getSelection().addRange(r);
    return update();
  }
  const inner = c.list || c.text; // what a new list, quote or callout takes in
  withCaret(() => {
    if (k === 'ul' || k === 'ol') {
      if (c.list) return convert(c.list, kind(c.list) === k ? 'unlist' : k);
      return convert(c.text, k);
    }
    if (k === 'quote') return c.quote ? convert(c.quote, 'unwrap') : convert(inner, 'quote');
    if (k === 'callout') return c.callout ? convert(c.callout, 'unwrap') : convert(inner, 'callout');
  });
}
$('toolbar').addEventListener('mousedown', (ev) => {
  const b = ev.target.closest('[data-tb]');
  ev.preventDefault(); ev.stopPropagation(); // keep the caret where it is
  if (b && !b.disabled) onToolbar(b.dataset.tb, b);
});
// Pointing at a crumb (or the style box) brackets its block. `render`
// re-reads it from the pointer's position each time.
let tbMouse = null;
function tbBlockAt(el, car) {
  const t = el && el.closest('#toolbar [data-tb]');
  if (t && t.dataset.tb === 'crumb') return byId.get(+t.dataset.id);
  if (t && t.dataset.tb === 'style' && !t.disabled) { const c = caretContext(car); return c.text || c.code || c.list || null; }
  return null;
}
$('toolbar').addEventListener('mousemove', (ev) => { tbMouse = { x: ev.clientX, y: ev.clientY }; schedule(); });
$('toolbar').addEventListener('mouseleave', () => { tbMouse = null; schedule(); });

// ---- drag --------------------------------------------------------------------
function startDrag(b) {
  closeMenu();
  drag = { el: b, parent: b.parentElement, sibs: [], at: null };
  document.body.classList.add('dragging');
  const onMove = (ev) => {
    const sibs = [...drag.parent.children].filter((c) => c.matches(SEL));
    let at = sibs.length;
    for (let i = 0; i < sibs.length; i++) { const r = sibs[i].getBoundingClientRect(); if (ev.clientY < r.top + r.height / 2) { at = i; break; } }
    drag.sibs = sibs; drag.at = at; schedule();
  };
  const onUp = () => {
    removeEventListener('mousemove', onMove);
    document.body.classList.remove('dragging');
    const d = drag; drag = null;
    if (d.at != null && d.sibs[d.at] !== d.el && d.sibs[d.at - 1] !== d.el) {
      withCaret(() => { if (d.at < d.sibs.length) d.sibs[d.at].before(d.el); else d.sibs[d.sibs.length - 1].after(d.el); return d.el; });
    } else schedule();
  };
  addEventListener('mousemove', onMove);
  addEventListener('mouseup', onUp, { once: true });
}

// ---- events -------------------------------------------------------------------
function onControlDown(ev) {
  const h = ev.target.closest('[data-drag]'), c = ev.target.closest('[data-menu]');
  if (!h && !c) return;
  ev.preventDefault(); ev.stopPropagation(); // keep the caret where it is
  if (h) {
    const ids = h.dataset.drag.split('-').map(Number), i = chipHover ? ids.indexOf(id(chipHover)) : -1;
    return startDrag(byId.get(i >= 0 ? ids[i] : ids[ids.length - 1]));
  }
  const b = byId.get(+c.dataset.menu);
  if (menu && menu.target === b) closeMenu(); else openMenu(b);
}
overlay.addEventListener('mousedown', onControlDown);
overlay.addEventListener('mouseover', (ev) => {
  const c = ev.target.closest('[data-menu]');
  if (c) { const b = byId.get(+c.dataset.menu); if (b !== chipHover) { chipHover = b; schedule(); } }
});
// Leaving a label forgets which of its chips was pointed at.
page.addEventListener('mousemove', (ev) => { if (chipHover && !ev.target.closest('.ann')) { chipHover = null; schedule(); } });
let lastMove = null;
document.addEventListener('mousemove', (ev) => {
  if (typing && lastMove && Math.hypot(ev.clientX - lastMove.x, ev.clientY - lastMove.y) > 3) { typing = false; schedule(); }
  lastMove = { x: ev.clientX, y: ev.clientY };
});
crumbs.addEventListener('mousedown', onControlDown);
crumbs.addEventListener('mouseover', (ev) => { const c = ev.target.closest('[data-menu]'); const b = c && byId.get(+c.dataset.menu); if (b !== crumbHover) { crumbHover = b; schedule(); } });
crumbs.addEventListener('mouseleave', () => { crumbHover = null; schedule(); });
document.addEventListener('mousedown', (ev) => { if (menu && !menuEl.contains(ev.target)) closeMenu(); });
page.addEventListener('mousemove', (ev) => { mouse = { x: ev.clientX, y: ev.clientY }; overAnn = !!ev.target.closest('.ann'); schedule(); });
page.addEventListener('mouseleave', () => { mouse = null; overAnn = false; schedule(); });
$('scroller').addEventListener('scroll', () => { closeMenu(); schedule(); });
addEventListener('resize', () => { closeMenu(); schedule(); });
document.addEventListener('selectionchange', schedule);

document.addEventListener('keydown', (ev) => {
  if (menu) {
    if (ev.key === 'ArrowDown') { ev.preventDefault(); stepMenu(1); return; }
    if (ev.key === 'ArrowUp') { ev.preventDefault(); stepMenu(-1); return; }
    if (ev.key === 'Enter') { ev.preventDefault(); const it = menu.items[menu.i]; if (it && it.run) choose(it); return; }
    if (ev.key === 'Escape') { ev.preventDefault(); closeMenu(); return; }
    closeMenu();
  }
  if (document.activeElement !== body) return;
  // A keystroke that edits counts as typing; moving the caret doesn't.
  if (!ev.metaKey && !ev.ctrlKey && !ev.altKey && (ev.key.length === 1 || ['Backspace', 'Delete', 'Enter', 'Tab'].includes(ev.key)) && !typing) { typing = true; schedule(); }
  const chain = caretChain(), b = chain[chain.length - 1];
  if (!b) return;
  if ((ev.metaKey || ev.ctrlKey) && ev.key === '/') { ev.preventDefault(); openMenu(b); }
  if (ev.altKey && (ev.key === 'ArrowUp' || ev.key === 'ArrowDown')) { ev.preventDefault(); withCaret(() => move(b, ev.key === 'ArrowUp' ? -1 : 1)); }
}, true);

function update() {
  // Selecting everything and deleting can leave no block.
  if (![...body.children].some((c) => c.matches(SEL))) {
    body.innerHTML = '<p><br></p>';
    const r = document.createRange(); r.setStart(body.firstChild, 0); getSelection().removeAllRanges(); getSelection().addRange(r);
  }
  schedule();
}
body.addEventListener('input', update);

body.innerHTML = FIXTURE;
apply();
</script>
</body>
