[package]
name = "wasm-quarto-hub-client"
version = "0.1.0"
edition = "2021"
authors = ["Posit, PBC"]
license = "MIT"
description = "WASM client for quarto-hub web frontend"

[lib]
crate-type = ["cdylib"]

[dependencies]
pampa = { path = "../pampa", default-features = false, features = ["lua-filter"] }
wasm-c-shim = { path = "../wasm-c-shim" }
quarto-ast-reconcile = { path = "../quarto-ast-reconcile" }
quarto-core = { path = "../quarto-core" }
# NOTE: `quarto-error-catalog` is intentionally NOT a dependency here — the WASM
# bridge never surfaces docs URLs, so installing the catalog would only bloat the
# bundle past the PWA precache limit. See the comment in `init()` in src/lib.rs.
quarto-error-reporting = { version = "0.2.1", features = ["json"] }
# Direct dep so the test-only `quarto_highlight_for_test` export can
# call the Registry-backed highlight path. Same crate quarto-core uses
# via CodeHighlightStage — ensuring WASM tests exercise the same code
# path as native tests.
quarto-highlight = { path = "../quarto-highlight" }
quarto-lsp-core = { path = "../quarto-lsp-core" }
quarto-pandoc-types = { path = "../quarto-pandoc-types" }
quarto-sass = { path = "../quarto-sass" }
quarto-source-map = "0.1.0"
quarto-system-runtime = { path = "../quarto-system-runtime", features = ["js-bridge"] }
quarto-project-create = { path = "../quarto-project-create" }
quarto-trace = { path = "../quarto-trace" }
flate2 = "1.1"
wasm-printf-fmt = { path = "../wasm-printf-fmt" }
wasm-bindgen = "0.2"
# Exact-pinned to match the vendored `wasm-bindgen-futures-patch` (see
# `[patch.crates-io]` below and `quarto-system-runtime/Cargo.toml` for
# the rationale). To upgrade, bump the vendored patch first.
wasm-bindgen-futures = "=0.4.58"
web-sys = { version = "0.3", features = ["console"] }
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
yaml-rust2 = "0.11"
console_error_panic_hook = "0.1"
include_dir = "0.7"
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }

# Declare this as its own workspace so cargo does not traverse up into the
# parent monorepo workspace when building from a nested directory (e.g. a
# git worktree inside the main repo tree).
[workspace]

[patch.crates-io]
lua-src = { path = "../lua-src-wasm" }
wasm-bindgen-futures = { path = "../wasm-bindgen-futures-patch" }
# Neutralize upstream's wasm32 stdio/stdlib/string stubs so our
# c_shim.rs is the single source of truth for C stdlib symbols. See
# ../../claude-notes/plans/2026-04-20-wasm-shim-merge.md.
tree-sitter-language = { path = "../tree-sitter-language-wasm-shim" }

# Size-tuned for the live-share join payload (plan
# `claude-notes/plans/2026-08-13-live-share-local-spa-assets.md`, Phase 1;
# `hub-client/scripts/build-wasm.js` follows this with `wasm-opt -Oz`).
# Measured on the shipped `*_bg.wasm` (2026-08-13): baseline 41,909,271 B;
# per-knob codegen-units=1 → 36,683,806, opt-level="s" → 38,724,917,
# lto=true → 41,173,913 (lto="thin" alone *regresses*: 46,500,921);
# combined 32,726,966; combined + wasm-opt -Oz → 26,898,758 (−35.8%).
# `panic = "abort"` is not an option: Lua needs panic=unwind (see
# `.cargo/config.toml`).
[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
