# P2P tunnel for `q2 preview --share` / `--join` (live share over iroh).
# Encapsulates ALL iroh usage; quarto-preview and the q2 CLI see only the
# ticket + tunnel types exported from this crate. Native-only: must never
# enter the wasm-quarto-hub-client closure (Gate 0 / Phase 0 static check:
# `cargo tree -i iroh` from that crate must fail).
# Plan: claude-notes/plans/2026-08-03-q2-preview-live-share-iroh.md
[package]
name = "quarto-p2p"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "iroh-based P2P tunnel for q2 preview live share (--share / --join)"

[dependencies]
# StreamExt for the client's per-connection path watcher
# (`Connection::paths_stream`), which feeds the direct-vs-relay status.
futures = "0.3"
iroh = "1.0.3"
iroh-tickets = "1.0"
# Ticket wire format (postcard of {addr, token}); same encoding stack
# iroh-tickets itself uses.
postcard = { version = "1.1", features = ["use-std"] }
rand = "0.9"
serde.workspace = true
subtle = "2"
thiserror.workspace = true
# io-util + net are required (io::join / copy_bidirectional / TcpListener);
# time for token-read timeouts + re-dial backoff; sync for the status
# watch channel. The workspace default set (rt-multi-thread, macros) lacks
# all four and today they unify on only via quarto-hub's `full`.
tokio = { workspace = true, features = ["io-util", "net", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
# Tunnel-target servers for the integration tests (plain HTTP + /ws echo).
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
tokio-tungstenite = "0.29"

[lints]
workspace = true
