[package]
name = "quarto-sass"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "SASS compilation infrastructure for Quarto"

[dependencies]
serde.workspace = true
# Parsing vendored `.theme` highlight-palette JSON (highlight_theme.rs)
serde_json.workspace = true
serde_yaml.workspace = true
yaml-rust2.workspace = true
thiserror.workspace = true
regex.workspace = true
once_cell.workspace = true
include_dir.workspace = true
# Runtime abstraction for cross-platform file access (WASM + native)
quarto-system-runtime.workspace = true
# Shared path helpers (to_forward_slashes for virtual-resource key normalization)
quarto-util.workspace = true
# ConfigValue for theme config extraction
quarto-pandoc-types.workspace = true
# SourceInfo for source-mapped diagnostics
quarto-source-map.workspace = true
# Brand (_brand.yml) data model and resolution
quarto-brand.workspace = true

[build-dependencies]
sha2 = "0.11"

[dev-dependencies]
insta.workspace = true
serde_json.workspace = true
yaml-rust2.workspace = true
tempfile = "3"
quarto-brand.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
grass.workspace = true

[lints]
workspace = true
