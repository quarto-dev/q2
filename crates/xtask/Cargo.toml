[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false
description = "Project-specific automation tasks for Quarto Rust"

# This crate is for development tasks only, not part of the library API
[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
quarto-math = { path = "../quarto-math", features = ["spec-gen"] }
clap = { workspace = true }
insta = { workspace = true }
nodejs-semver = "5"
proc-macro2 = { workspace = true }
quarto-output-extract = { path = "../quarto-output-extract" }
quarto-pandoc-recording = { path = "../quarto-pandoc-recording" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
syn = { workspace = true }
tempfile = "3"
time = { version = "0.3", features = ["macros", "formatting"] }
walkdir = { workspace = true }
# Same version and features as quarto-core; `capture-import-recordings generate` patches docx.
zip = { version = "6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
