[package]
name = "quarto-system-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Runtime abstraction layer for Quarto system operations"

[features]
# Enables wasm-bindgen `raw_module` imports of the JS bridge files at
# /src/wasm-js-bridge/{template,sass,cache,fetch}.js.
#
# Hub-client provides those JS modules at runtime via Vite. Off-by-default
# because non-hub-client wasm32 binaries (e.g. wasm-bindgen-test runs of
# pampa) have no bridge to require — Node.js fails to resolve the absolute
# paths at module load. With the feature off, the impls return errors.
default = []
js-bridge = []

[dependencies]
# Async methods in traits
async-trait.workspace = true
# JSON serialization for JS interop
serde_json.workspace = true
# Serde derive for fetch_url response deserialization
serde.workspace = true

# Native-only dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# For binary lookup on PATH
which = "8.0"
# HTTP client for fetch_url
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking"] }
# Base64 encoding/decoding for fetch_url WASM response (also used native-side for parity)
base64.workspace = true
# Safe temp directory creation (random names, no collisions under parallel execution)
tempfile = "3.24"
# SASS compilation (pure Rust, ~2x faster than dart-sass)
grass.workspace = true

# WASM-only dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
# JavaScript interop for browser JS calls.
# `wasm-bindgen-futures` is exact-pinned to `=0.4.58` to match the
# vendored `wasm-bindgen-futures-patch` (see
# `crates/wasm-bindgen-futures-patch/Cargo.toml`), which the
# wasm-quarto-hub-client crate substitutes via `[patch.crates-io]`.
# Without `=0.4.58`, cargo's resolver prefers the latest crates.io
# release (currently 0.4.70) over the patch — silently dropping the
# patch and pulling in a newer wasm-bindgen that mismatches the
# project's installed `wasm-bindgen-cli` and our vendored exact pins
# (`wasm-bindgen = "=0.2.108"`, `js-sys = "=0.3.85"`). The pin makes
# the patch the only valid resolution, so the upstream lockfile
# regenerates deterministically. To intentionally upgrade, bump the
# vendored patch first, then this pin.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "=0.4.58"
js-sys = "0.3"
# Base64 decoding for fetch_url response (content is base64-encoded by JS shim)
base64.workspace = true

[dev-dependencies]
tempfile = "3.24"
pollster = "0.4"

[lints]
workspace = true
