[package]
name = "quarto-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core rendering infrastructure for Quarto"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
async-trait.workspace = true
tokio-util.workspace = true
pollster.workspace = true
serde_json.workspace = true
yaml-rust2.workspace = true
hashlink = "0.11"
pathdiff = "0.2"
sha2 = "0.11"
hex = "0.4"
glob = "0.3"
# `time` for date formatting (used by L1 ListingItemInfoStage; see
# claude-notes/plans/2026-05-05-listings-L1-autofill-stage.md §D12).
# `formatting` enables `OffsetDateTime::format`; `macros` enables the
# compile-time `format_description!` macro. WASM-compatible.
time = { version = "0.3", features = ["formatting", "macros"] }

quarto-util.workspace = true
quarto-system-runtime.workspace = true
quarto-pandoc-types.workspace = true
quarto-source-map.workspace = true
quarto-doctemplate.workspace = true
quarto-error-reporting.workspace = true
quarto-config.workspace = true
quarto-yaml.workspace = true
quarto-ast-reconcile.workspace = true
quarto-analysis.workspace = true
quarto-sass.workspace = true
quarto-trace.workspace = true
quarto-navigation.workspace = true
pampa = { workspace = true, features = ["lua-filter", "json-filter"] }
# Syntax highlighting. Uses statically linked tree-sitter grammar crates
# on both native and wasm32. The `wasm` feature on `tree-sitter` (which
# pulls in wasmtime for native user-grammar loading) is gated inside the
# `quarto-highlight` crate itself to avoid compiling wasmtime for the
# wasm32-unknown-unknown target.
quarto-highlight.workspace = true

# Native-only dependencies (for execution engines and resource extraction)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"
include_dir = "0.7"
which = "8"
regex = "1.12"

# Jupyter engine dependencies (native only)
runtimelib = { version = "2.0", features = ["tokio-runtime"] }
jupyter-protocol = "2.0"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "process", "fs", "net", "io-util"] }
uuid.workspace = true
base64.workspace = true

[dev-dependencies]
flate2.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true
