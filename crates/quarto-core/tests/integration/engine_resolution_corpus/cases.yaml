# Engine-resolution corpus (bd-yt2o2ovt design review, 2026-11-04).
#
# Each case is a pure resolver input (metadata layers + code-cell languages +
# registry) with the expected engine sequence and per-language ownership under
# the TARGET design (D2b, claude-notes/plans/2026-11-04-engine-interface-review.md).
# Driven by `engine_resolution_corpus.rs`; rendered for humans in
# claude-notes/research/2026-11-04-engine-resolution-corpus.md.
#
# Fields
#   id          stable id (never reuse)
#   title       one line
#   project     optional project-layer front matter (YAML text), merged below the document
#   front_matter  document front matter (YAML text, may be empty)
#   languages   code-cell languages in document order; "python .marimo" adds a class
#   registry    E1 built-ins (knitr, jupyter, markdown); E2 + Julia extension
#               (Primary 1 on julia); E3 + marimo-style extension (Primary 1 on
#               python with first class marimo); E3b same at Primary 2
#   expect      target: sequence (engine names) and ownership (language -> engine)
#   status      pass              the current resolver already meets `expect`
#               pending-phase4    current resolver differs; `today` pins what it does now
#   today       current sequence/ownership (required when status is pending-phase4)
#   q1          what Quarto 1 does; q1_verified: RAN | DERIVED | none (q2-only syntax)
#   verdict     intuitive | surprising | q2-only | divergence
#   notes       free text; Rn refers to the plan's recommendations
#
# Sequence order is asserted exactly for E1. For E2/E3/E3b it is compared as a
# set: the test cannot set the registry contribution order (no public API), and
# a real registry lists extension engines before the built-ins.

