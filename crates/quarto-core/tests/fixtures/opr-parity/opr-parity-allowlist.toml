# OPR-0b: PROPOSED divergences between a plain render and a recorded render (the recorded route is
# the presenter's, which OPR-7a makes the plain route for Julia and knitr). Read by
# `tests/integration/opr_parity_harness.rs`. Gordon signs each entry after OPR-7c lands (`proposed` to `signed`); until then every
# entry is `status = "proposed"` and the baseline report lists the differences each one explains.
#
# Fields:
#   name    a short label
#   rule    a built-in normalization applied to BOTH sides (`RULES` in the harness): it hides the
#           difference it names and nothing else
#   scope   a document-name prefix the entry covers (`julia/`)
#   status  `proposed` or `signed`
#   reason  why the divergence is intended, with the evidence
#
# Not an entry, on purpose: the references to a `fig-subcap` group. The recorded Julia route leaves
# them unresolved where the plain route resolves them (wrongly). That is a blocker for Gordon
# (bd-gbaykhth, bd-au5gts6e; OPR-7d decision 3), not an allowlist candidate.

[[entry]]
name = "julia wrapper id"
rule = "julia-cell-id"
scope = "julia/"
status = "proposed"
reason = "the engine route stamps id=\"cell-N\" (N from the unit ordinal) on the cell wrapper; the presenter does not. Nothing in crates/, ts-packages/, hub-client/src or resources/ reads it (OPR-0c, grep)"

[[entry]]
name = "julia wrapper data-quarto"
rule = "julia-data-quarto"
scope = "julia/"
status = "proposed"
reason = "the engine route stamps data-quarto (unit, language, absolute file path, line) on the cell wrapper; the presenter does not. Nothing reads it (OPR-0c, grep)"

[[entry]]
name = "julia output data-execution_count"
rule = "julia-data-execution-count"
scope = "julia/"
status = "proposed"
reason = "the engine route stamps data-execution_count on the output div; the presenter does not. Nothing reads it (OPR-0c, grep)"

[[entry]]
name = "julia figure output class"
rule = "julia-cell-output-class"
scope = "julia/"
status = "proposed"
reason = "the presenter drops the generic cell-output class from a figure's output div, to match q2-knitr's figure hook (presenter/cell.rs). The only reader of .cell-output is resources/js/dashboard/quarto-dashboard.js:49, which restyles iTables HTML tables, not figures (OPR-0c)"

[[entry]]
name = "julia figure file names"
rule = "julia-figure-names"
scope = "julia/"
status = "proposed"
reason = "the two routes name figure files from different counters (cell-2-output-1.png plain, cell-1-output-1.png recorded): the plain number comes from the unit ordinal, which counts prose, the presenter's counts cells. Quarto 1 matches the plain name for an unlabeled cell only (OPR-0c), so every figure URL changes at the flip"

[[entry]]
name = "knitr empty cell wrapper"
rule = "knitr-empty-cell-wrapper"
scope = "knitr"
status = "proposed"
reason = "R writes an empty .cell div for a chunk that renders nothing (a setup chunk, include false); the presenter writes none. The same divergence is already signed off for the knitr baseline (knitr allowlist.toml, s1/03_eval_false and markdown-stress/empty_output; epic decision 23), so Gordon carries it into the plain-render switch in OPR-7c"

[[entry]]
name = "knitr split blockquote"
rule = "knitr-adjacent-blockquotes"
scope = "knitr"
status = "proposed"
reason = "R's markdown puts a blank line inside a quoted chunk, so the quote renders as two adjacent blockquotes; the presenter renders one. The same divergence is already a blocker-class entry in the knitr allowlist.toml (structure/chunk_in_blockquote, epic decision 23), seen here at page level (OPR-7c)"

[[entry]]
name = "julia code block leading newline"
rule = "julia-code-leading-newline"
scope = "julia/"
status = "proposed"
reason = "the engine route keeps a blank first line of a code block (a newline right after the opening code tag); the presenter trims it. A browser ignores a newline at the start of a pre, so nothing visible changes (OPR-7c, julia/docs-index-chunk)"
