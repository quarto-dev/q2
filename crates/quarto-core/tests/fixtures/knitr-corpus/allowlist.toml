[[entry]]
name = "options/indent/header/00_empty"
class = "blocker"
reason = "live knitr indents the whole cell by the option's value (two spaces); the presenter ignores `indent`, because knitr sets it from the chunk's container indent and the splice re-applies container prefix and indent, so presenting it would double-indent a nested chunk (KNR-3 slice 7, D8: Gordon, 2026-11-03). KNR-6 decides what a header `indent` does once the skeleton marker's indent is known; `indent` is undocumented and unused in docs/ and the smoke tests"

