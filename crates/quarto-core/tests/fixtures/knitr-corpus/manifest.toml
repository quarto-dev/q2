# KNR-1 Phase 1D: the knitr corpus manifest.
#
# Read by `tests/integration/knitr_corpus_support.rs`. Nothing here is rendered text: the
# generator turns each entry into fixture documents, deterministically.
#
#   [[sweep]]    one fixture per (value x form) of one chunk option.
#                  option   chunk option name (header form `opt=value`, YAML form `#| opt: value`)
#                  values   R literals, or { r = "...", yaml = "..." } when the YAML form differs
#                           (`yaml = ""` drops the YAML form for that value)
#                  forms    "header", "yaml" (default both)
#                  body     the chunk's R code (default: a printing/message/warning chunk, which has
#                           two source groups); body_ref = "single_body" (one source group) or
#                           "plot_body" names a shared body
#                  formats  target formats to run (default ["html"])
#                  fixed    options set to one R literal in every fixture of the sweep
#   [[document]] one verbatim fixture (`text`), for anything a single option cannot express.
#   [[handwritten]] a directory of committed fixtures next to this file (S1 to S9);
#                  `expect = "abort"` lists stems whose render aborts by design.
#
# Every generated fixture gets one trailing `Filler:` paragraph of seeded words; that line and
# the seed-sampled subset are the only seed-dependent things (see `corpus_generator_is_deterministic`).
# Fixtures call set.seed() and avoid Sys.time() and temp paths in their output.

[defaults]
body = '''
x <- 1:3
x
message("a message")
warning("a warning")
'''
single_body = '''
x <- 1:3
x
'''
plot_body = '''
set.seed(1)
plot(1:3)
plot(3:1)
'''

