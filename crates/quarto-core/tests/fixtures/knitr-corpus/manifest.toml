# ---------------------------------------------------------------------------------------------
# Setup-chunk state
# ---------------------------------------------------------------------------------------------

[[document]]
group = "setup-state"
name = "opts_chunk_set"
text = '''
```{r setup, include=FALSE}
knitr::opts_chunk$set(echo = FALSE, comment = "#>")
```

```{r use}
x <- 1:3
x
```
'''

[[document]]
group = "setup-state"
name = "opts_template"
text = '''
```{r setup, include=FALSE}
knitr::opts_template$set(quiet = list(echo = FALSE, message = FALSE))
```

```{r use, opts.label="quiet"}
x <- 1:3
x
message("hidden")
```
'''

[[document]]
group = "setup-state"
name = "ref_label"
text = '''
```{r source_chunk, include=FALSE}
y <- 5
y
```

```{r use_ref, ref.label="source_chunk"}
```
'''

[[document]]
group = "setup-state"
name = "opts_hooks"
text = '''
```{r setup, include=FALSE}
knitr::opts_hooks$set(fig.width = function(options) {
  options$fig.height <- options$fig.width / 2
  options
})
```

```{r use, fig.width=6}
plot(1:3)
```
'''

[[document]]
group = "setup-state"
name = "knit_hooks_override"
text = '''
```{r setup, include=FALSE}
knitr::knit_hooks$set(source = function(x, options) paste0("SOURCE-HOOK\n", paste(x, collapse = "\n"), "\n"))
```

```{r use}
x <- 1:3
x
```
'''

# ---------------------------------------------------------------------------------------------
# Content that stresses the markdown writer
# ---------------------------------------------------------------------------------------------

[[document]]
group = "markdown-stress"
name = "backtick_runs"
text = '''
```{r}
cat("a ``` fence inside output\n")
cat("and ```` four\n")
```
'''

[[document]]
group = "markdown-stress"
name = "block_start_lines"
text = '''
```{r}
cat("::: not a div\n")
cat("---\n")
cat("# not a heading\n")
cat("> not a quote\n")
cat("- not a list\n")
cat("1. not a list\n")
```
'''

[[document]]
group = "markdown-stress"
name = "whitespace"
text = '''
```{r}
cat("trailing spaces   \n")
cat("a\ttab\n")
cat("\n\n\nblank lines above\n")
```
'''

[[document]]
group = "markdown-stress"
name = "ansi_and_unicode"
text = '''
```{r}
cat("\033[31mred\033[0m\n")
cat("café 中文 \U0001F600\n")
```
'''

[[document]]
group = "markdown-stress"
name = "empty_output"
text = '''
```{r}
invisible(1)
```

```{r}
```

```{r}
cat("")
```
'''

[[document]]
group = "markdown-stress"
