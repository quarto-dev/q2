[package]
name = "quarto-project-create"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Project scaffolding for Quarto projects"

[dependencies]
# Template rendering (Pandoc template syntax, pure Rust, native + WASM)
quarto-doctemplate.workspace = true

# Serialization for types
serde.workspace = true

# Error handling
thiserror.workspace = true

[dev-dependencies]
# Round-trip parsing of scaffolded _quarto.yml in tests: asserting on
# parsed YAML structure is precise (field values, not substring hits)
# and proves the rendered config is valid YAML.
serde_yaml.workspace = true

[lints]
workspace = true
