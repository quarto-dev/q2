# Written for Quarto 2; Quarto 1 refuses to render it.
quarto-required: "^2"

project:
  render:
    - "**/*.qmd"
    - "**/*.md"
  type: website
  resources:
    - styles.css

website:
  title: "Website"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - features.qmd
      - about.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
