[package]
name = "quarto-lsp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Language Server Protocol implementation for Quarto documents"

[lib]
name = "quarto_lsp"
path = "src/lib.rs"

[dependencies]
# LSP transport (bd-ojsx06at, decision D1): rust-analyzer's synchronous
# server scaffold; its in-order message channel is the analysis loop.
lsp-server = "0.10"
# lsp-server pairs with lsp-types 0.97 (fluent-uri). q2 hub-lsp's tower-lsp
# stays on 0.94 until F3 folds it in (decision R4).
lsp-types = "0.97"
crossbeam-channel = "0.5"
# Background analysis jobs (the project sweep).
rayon = "1"
# File watching when the client cannot watch for us.
notify = "8"
notify-debouncer-mini = "0.7"

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
anyhow.workspace = true

# Logging
tracing.workspace = true

# Local crates
pampa = { workspace = true }
quarto-core = { workspace = true }
quarto-lsp-core = { workspace = true }
quarto-lsp-project = { workspace = true }
quarto-system-runtime = { workspace = true }
quarto-util.workspace = true

# stdout is reserved for JSON-RPC (src/stdio.rs): fd/handle redirection.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
insta.workspace = true
tempfile = "3"

[lints]
workspace = true
