[package]
name = "quarto"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Quarto command-line interface (Development Build)"

[[bin]]
name = "q2"
path = "src/main.rs"

[dependencies]
clap.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
pollster.workspace = true
# `signal` for the `provide-hub` serve loop's Ctrl-C shutdown.
tokio = { workspace = true, features = ["signal"] }

quarto-core = { workspace = true, features = ["clap"] }
quarto-error-catalog.workspace = true
quarto-error-reporting = { workspace = true, features = ["json"] }
quarto-source-map.workspace = true
quarto-trace.workspace = true
quarto-trace-server.workspace = true
quarto-util.workspace = true
quarto-project-create.workspace = true
quarto-system-runtime.workspace = true
quarto-doctemplate.workspace = true
quarto-lsp = { workspace = true }
quarto-hub.workspace = true
quarto-hub-provider = { path = "../quarto-hub-provider" }
quarto-mcp-launcher = { path = "../quarto-mcp-launcher" }
quarto-preview = { path = "../quarto-preview" }
url = "2.5"
quarto-publish.workspace = true
quarto-sass.workspace = true
quarto-test.workspace = true
serde_yaml.workspace = true
tempfile = "3"
# Phase D.1 (bd-kw93.8): auto-open browser tabs on `q2 preview`.
# `open` shells out to the platform-native launcher (`open` on macOS,
# `xdg-open` on Linux, `cmd /C start` on Windows). No heavy transitive
# tree.
open = "5"
# Only via the vendored-openssl feature (see [features]); never a
# direct code dependency.
openssl-sys = { version = "0.9", optional = true }

[build-dependencies]

[features]
# Release-build knob (plan D4, bd-c6l13j79): samod →
# tokio-tungstenite(native-tls) → openssl-sys links openssl on Linux;
# without this feature the binary picks up a runtime dependency on the
# build host's libssl. The release workflow's linux legs enable it so
# openssl is built from source and linked statically; dev builds are
# untouched. (Static *musl* is off the table entirely: rusty_v8, via
# deno_core → quarto-system-runtime, publishes no musl prebuilt
# archives — both linux legs 404'd in the v0.1.0 dry-run.)
vendored-openssl = ["dep:openssl-sys", "openssl-sys/vendored"]

[dev-dependencies]
tempfile = "3"
pampa.workspace = true
sha2 = "0.11"
walkdir.workspace = true

[lints]
workspace = true

