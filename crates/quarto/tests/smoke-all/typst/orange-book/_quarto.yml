project:
  type: book

brand: _brand.yml

book:
  title: "Test Typst Book"
  author: "Test Author"
  date: "2024-01-01"
  chapters:
    - index.qmd
    - part: "Part I: Getting Started"
      chapters:
        - chapter1.qmd
    - part: "Part II: Advanced Topics"
      chapters:
        - chapter2.qmd
        - chapter3.qmd
  appendices:
    - appendix.qmd
    - appendix-b.qmd
  references: references.qmd

# TEMPORARY (bd-l6eh1635): pandoc -f biblatex -t csljson references.bib -o
# references.json — citeproc's load_bibliography only parses CSL-JSON today,
# not BibTeX. references.bib is kept in the tree, untouched, as the real
# source; swap this back to `references.bib` once bd-l6eh1635's BibTeX
# support merges (workspace-6, branch braid/bd-l6eh1635-bibtex-citeproc), and
# delete references.json.
bibliography: references.json
citeproc: true

crossref:
  custom:
    - kind: float
      key: dino
      reference-prefix: Dinosaur

format:
  typst:
    keep-typ: true
    toc-depth: 17
    theorem-appearance: fancy
