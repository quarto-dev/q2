[package]
name = "quarto-doctemplate"
version = "0.1.0"
description = "Pandoc-compatible document template engine for Quarto"
publish = false
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Tree-sitter grammar for template syntax
tree-sitter-doctemplate = { path = "../tree-sitter-doctemplate" }
tree-sitter = { workspace = true }

# Generic tree-sitter traversal utilities
quarto-treesitter-ast = { workspace = true }
quarto-error-reporting = { path = "../quarto-error-reporting" }
quarto-source-map = { path = "../quarto-source-map" }

# Error handling
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
