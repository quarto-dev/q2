[package]
name = "pampa"
version = "0.0.0"
publish = false
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pampa"
path = "src/main.rs"

[[bin]]
name = "ast-reconcile"
path = "src/bin/ast_reconcile.rs"

[package.metadata]
cargo-fuzz = true

[features]
default = ["terminal-support", "json-filter", "lua-filter", "template-fs"]
terminal-support = ["dep:crossterm", "dep:supports-hyperlinks"]
terminal-hyperlinks = ["dep:supports-hyperlinks"]
# Enable JSON filter support (requires subprocess spawning, disable for WASM)
json-filter = []
# Enable Lua filter support (disable for WASM, where mlua is not available)
lua-filter = ["dep:mlua"]
# Enable filesystem-based template resolution (disable for WASM)
template-fs = []

[dependencies]
tree-sitter = { workspace = true }
tree-sitter-qmd = { workspace = true }
comrak = { version = "0.50.0", default-features = false }
comrak-to-pandoc = { path = "../comrak-to-pandoc" }
quarto-error-reporting = { path = "../quarto-error-reporting" }
quarto-source-map = { path = "../quarto-source-map" }
quarto-yaml = { path = "../quarto-yaml" }
quarto-config = { path = "../quarto-config" }
quarto-parse-errors = { path = "../quarto-parse-errors" }
quarto-treesitter-ast = { workspace = true }
quarto-pandoc-types = { path = "../quarto-pandoc-types" }
quarto-ast-reconcile = { path = "../quarto-ast-reconcile" }
quarto-doctemplate = { workspace = true }
quarto-citeproc = { path = "../quarto-citeproc" }
quarto-csl = { path = "../quarto-csl" }
quarto-system-runtime = { workspace = true }
regex = { version = "1.12.3", features = ["unicode"] }
clap = { version = "4.5", features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
glob = "0.3"
paste = "1.0.15"
once_cell = "1.21.3"
yaml-rust2 = { workspace = true }
hashlink = { version = "0.11.0", features = ["serde_impl"] }
indexmap = "2.13"
quarto-error-message-macros = { path = "../quarto-parse-errors/error-message-macros" }
ariadne = "0.6"
crossterm = { version = "0.29", optional = true }
supports-hyperlinks = { version = "3.2", optional = true }
mlua = { version = "0.11", features = ["lua54", "vendored", "serialize", "async"], optional = true }
sha1 = "0.10"
base64 = "0.22"

# tokio is native-only: used by the pampa binary to block_on async filter execution.
# Not compiled for WASM (tokio's rt-multi-thread doesn't support wasm32).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }

[dev-dependencies]
quarto-util.workspace = true

# Native-only dev-dependencies (proptest pulls in getrandom which doesn't
# compile for wasm32-unknown-unknown; insta/tempfile/tokio are native-only too)
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
insta = { version = "1.46", features = ["json", "redactions"] }
proptest = "1.10"
tempfile = "3.24"
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
mlua = { version = "0.11", features = ["lua54", "vendored", "serialize"] }
wasm-bindgen-test = "0.3"

[lints]
workspace = true
