[package]
name = "quarto-hub"
version.workspace = true
authors.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
description = "Automerge-based collaborative editing infrastructure for Quarto projects"

[[bin]]
name = "hub"
path = "src/main.rs"

[lib]
name = "quarto_hub"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework (version 0.8 to match samod)
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "set-header"] }
http = "1"

# OAuth2 / JWT authentication
axum-jwt-auth = "0.6"
jsonwebtoken = "10"
tokio-util = { workspace = true }

# HTTP client for OIDC discovery
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# URL parsing for OIDC issuer validation
url = "2.5"

# Cookie building (already transitive via axum-jwt-auth)
cookie = "0.18"
time = "0.3"

# Automerge (via samod for JS compatibility)
# utf16-indexing: use UTF-16 code units for text indices, matching the JS/WASM client.
# Without this, the Rust default is UnicodeCodePoint, which disagrees with JS on
# non-BMP characters (emoji etc.) — each emoji is 1 code point but 2 UTF-16 code units.
automerge = { version = "0.10.0", features = ["utf16-indexing"] }
# Vendored samod fork carrying the synchronous AccessPolicy trait (long-term home).
samod = { version = "0.12.3", git = "https://github.com/quarto-dev/samod.git", branch = "access-policy", features = ["tokio", "axum", "tungstenite"] }

# Async streams (for samod event handling)
futures = "0.3"

# File locking
fs2 = "0.4"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# CLI
clap = { workspace = true }

# Utilities
quarto-util = { workspace = true }
walkdir = "2"
dirs = "6"

# Filesystem watching for continuous sync
notify = "8"
notify-debouncer-mini = "0.7"

# Cryptographic hashing for content checksums
sha2 = "0.11"

# HMAC for per-project actor ID derivation
hmac = "0.13"

# Random number generation for server secret
rand = "0.9"

# Hex encoding/decoding for change hash serialization
hex = "0.4"

# MIME type detection from file content
infer = "0.19"

# RFC 3339 createdAt stamps on capture-doc meta (bd-eiku4ymo).
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
# Phase 2 Bearer-auth integration tests: spin up a mock OIDC provider,
# mint signed JWTs, exercise the hub router against random ports.
rsa = { version = "0.9", features = ["pem", "getrandom"] }
base64 = "0.22"
parking_lot = "0.12"

[lints]
workspace = true
