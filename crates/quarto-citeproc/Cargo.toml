[package]
name = "quarto-citeproc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Citation processing engine using CSL styles"

[dependencies]
quarto-csl = { path = "../quarto-csl" }
quarto-error-reporting = { workspace = true }
quarto-pandoc-types = { path = "../quarto-pandoc-types" }
quarto-source-map = { workspace = true }
quarto-xml = { path = "../quarto-xml" }
hashlink = "0.11.0"
# debug-embed: embed in debug builds too, instead of baking the absolute
# folder path in and reading at runtime (location-dependent artifacts);
# deterministic-timestamps: reproducible bytes (bd-corgi-build-8fb3mzki).
rust-embed = { version = "8", features = ["include-exclude", "debug-embed", "deterministic-timestamps"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
similar = "3"
thiserror = { workspace = true }

[dev-dependencies]
insta = { workspace = true }

[build-dependencies]
glob = "0.3"

[[bin]]
name = "csl_conformance_report"
path = "src/bin/csl_conformance_report.rs"

[lints]
workspace = true
