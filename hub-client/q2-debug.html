<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>q2-debug Renderer (Sandboxed)</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #root {
      width: 100%;
      height: 100vh;
      overflow: auto;
      /* Containing block for the virtual caret (see entry.tsx). */
      position: relative;
      /* The virtual caret replaces the browser's selection model:
         clicks place the editor cursor instead (CURSOR_CLICK). */
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
    }
    #root [data-str-text] {
      cursor: text;
    }
    /* Virtual caret mirroring the Monaco cursor. Our own element, not
       the browser's selection caret: the debug DOM is never editable. */
    .q2-debug-caret {
      position: absolute;
      width: 2px;
      background: #d62828;
      pointer-events: none;
      z-index: 10;
      animation: q2-debug-caret-blink 1s step-end infinite;
    }
    .q2-debug-caret.unfocused {
      animation: none;
      background: #b0b0b0;
    }
    .q2-debug-caret.hidden {
      display: none;
    }
    /* Hidden input sink: receives typing in the preview and forwards it
       to the editor (see entry.tsx). Parked on the caret, invisible,
       but focusable. */
    .q2-debug-input {
      position: absolute;
      width: 1px;
      height: 1em;
      padding: 0;
      border: 0;
      margin: 0;
      opacity: 0;
      resize: none;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }
    /* Our own selection highlight (native selection is off). A
       see-through tint over the text, like a native selection; this is
       one of the cases where translucency is the point, so the usual
       solid-colour rule does not apply. The text keeps its own colour. */
    .q2-debug-selection {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 5;
      overflow: visible;
    }
    .q2-debug-selection-hull {
      fill: rgba(214, 40, 40, 0.18);
      stroke: rgba(214, 40, 40, 0.45);
      stroke-width: 1;
      stroke-linejoin: round;
    }
    @keyframes q2-debug-caret-blink {
      0%, 50% { opacity: 1; }
      50.01%, 100% { opacity: 0; }
    }
  </style>
  <script>
    // Stub out React Fast Refresh runtime for iframe context
    // Must be done before any modules load
    window.$RefreshReg$ = function () { };
    window.$RefreshSig$ = function () { return function (type) { return type; }; };
  </script>
</head>
<body>
  <div id="root">Loading q2-debug renderer...</div>
  <script type="module" src="/src/components/render/q2-debug/entry.tsx"></script>
</body>
</html>
