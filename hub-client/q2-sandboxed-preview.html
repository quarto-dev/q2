<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>q2-raw Renderer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Courier New', monospace;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #root {
      width: 100%;
      height: 100vh;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div id="root">Loading q2-raw renderer...</div>
  <script>
    // Inline entry point for q2-raw renderer
    // No external script loading needed - runs entirely in sandboxed iframe

    function updateAst(payload) {
      const { astJson } = payload;
      const rootElement = document.getElementById('root');

      if (!rootElement) {
        console.error('Root element not found');
        return;
      }

      try {
        // Parse and re-stringify with indentation for readability
        const ast = JSON.parse(astJson);
        const prettyJson = JSON.stringify(ast, null, 2);

        // Escape HTML to prevent XSS
        const escaped = prettyJson
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');

        rootElement.innerHTML = '<pre style="margin: 0; padding: 16px; font-family: \'Courier New\', monospace; font-size: 12px; white-space: pre-wrap; word-wrap: break-word;">' + escaped + '</pre>';
      } catch (err) {
        const errMsg = err instanceof Error ? err.message : String(err);
        const escapedErr = errMsg.replace(/</g, '&lt;').replace(/>/g, '&gt;');
        rootElement.innerHTML = '<div style="padding: 20px; color: red;"><strong>Parse Error:</strong><pre>' + escapedErr + '</pre></div>';
      }
    }

    // Listen for messages from parent
    window.addEventListener('message', function(event) {
      if (event.data.type === 'UPDATE_AST') {
        updateAst(event.data.payload);
      }
    });

    // Signal that the iframe is ready to receive messages
    window.parent.postMessage({ type: 'IFRAME_READY' }, '*');
  </script>
</body>
</html>
